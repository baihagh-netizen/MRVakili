
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pension_source_revised.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Project
        shell: bash
        run: |
          set -e
          test -f pension_source_revised.zip
          unzip -t pension_source_revised.zip
          mkdir -p source
          unzip -q pension_source_revised.zip -d source

          PROJECT_DIR="source/pension_user_source"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project verified."

      - name: Build APKs
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleUserDebug assembleAdminDebug --stacktrace

      - name: Find APKs
        shell: bash
        run: |
          set -e
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk"

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: Pension-User-APK
          path: source/pension_user_source/app/build/outputs/apk/user/debug/*.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Pension-Admin-APK
          path: source/pension_user_source/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
