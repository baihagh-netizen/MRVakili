name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "pension_source_revised.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ZIP file..."

          if [ ! -f pension_source_revised.zip ]; then
            echo "ERROR: pension_source_revised.zip not found!"
            exit 1
          fi

          unzip -t pension_source_revised.zip

          mkdir -p source
          unzip -q pension_source_revised.zip -d source

      - name: Debug project structure
        shell: bash
        run: |
          echo "===== DIRECTORY TREE ====="
          find source -type f | sort

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find source -type f -name settings.gradle | head -n 1 | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          echo "Detected project: $PROJECT_DIR"

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew

            ./gradlew \
              assembleUserDebug \
              assembleAdminDebug \
              --stacktrace
          else
            gradle \
              assembleUserDebug \
              assembleAdminDebug \
              --stacktrace
          fi

          echo "APK build completed"

          find . -type f -name "*.apk"

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: Android-APKs
          path: |
            source/**/*.apk
          if-no-files-found: error
