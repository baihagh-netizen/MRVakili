name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "pension_source_revised.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(which sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check and extract source ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f pension_source_revised.zip ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir -p source

          unzip -q pension_source_revised.zip -d source

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find source -name settings.gradle -type f | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          echo "Project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Show project structure
        shell: bash
        run: |
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Show Gradle tasks
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew tasks --all
          else
            gradle tasks --all
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK files
        shell: bash
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Pension-APK
          path: |
            source/**/*.apk
          if-no-files-found: error
