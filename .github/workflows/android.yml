name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pension_source_revised.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # GitHub's ubuntu-latest image already contains Android SDK.
      # Avoid android-actions/setup-android here: it fails while replacing
      # the runner's preinstalled sdkmanager in this workflow.
      - name: Accept Android SDK licenses and install required packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source ZIP
        run: |
          set -e
          mkdir -p source
          unzip -q pension_source_revised.zip -d source
          test -f source/pension_user_source/settings.gradle
          test -f source/pension_user_source/app/build.gradle
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/pension_user_source" >> "$GITHUB_ENV"

      - name: Build user and admin APKs
        run: gradle -p "$PROJECT_DIR" assembleUserDebug assembleAdminDebug

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Pension-Calculator-APKs
          path: |
            source/pension_user_source/app/build/outputs/apk/user/debug/*.apk
            source/pension_user_source/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
