name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "pension_source_revised.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract ZIP and detect project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ZIP..."

          test -f pension_source_revised.zip

          rm -rf source
          mkdir -p source

          unzip -o pension_source_revised.zip -d source

          echo "===== Extracted files ====="
          find source | sort

          SETTINGS_FILE=$(find source -type f $$ -name "settings.gradle" -o -name "settings.gradle.kts" $$ | head -n 1)

          echo "SETTINGS_FILE=$SETTINGS_FILE"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Detected project: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found"
            exit 1
          fi

      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found"
            ls -la
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version

          ./gradlew \
            assembleUserDebug \
            assembleAdminDebug \
            --stacktrace

      - name: Show APK files
        shell: bash
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: Pension-User-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/user/debug/*.apk
          if-no-files-found: warn

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Pension-Admin-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: warn
