
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pension_source_revised.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses < /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking source ZIP..."

          if [ ! -f pension_source_revised.zip ]; then
            echo "ERROR: pension_source_revised.zip not found in repository root"
            exit 1
          fi

          unzip -t pension_source_revised.zip

          mkdir -p source
          unzip -q pension_source_revised.zip -d source

          echo "=== Extracted files ==="
          find source -maxdepth 5 -type f | sort

          echo "Searching for Android project..."

          SETTINGS_FILE="$(find source -type f -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found"
            echo "Project directory: $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Build user and admin APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Android APKs..."
          echo "Project: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleUserDebug assembleAdminDebug --stacktrace

          echo "Build completed."

          echo "=== Generated APK files ==="
          find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload user APK
        uses: actions/upload-artifact@v4
        with:
          name: Pension-User-APK
          path: source/**/app/build/outputs/apk/user/debug/*.apk
          if-no-files-found: error

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Pension-Admin-APK
          path: source/**/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
