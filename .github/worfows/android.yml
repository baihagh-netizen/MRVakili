name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "pension_source_revised.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract and verify project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ZIP..."

          test -f pension_source_revised.zip

          unzip -t pension_source_revised.zip

          rm -rf source
          mkdir -p source

          unzip -q pension_source_revised.zip -d source

          echo "===== Extracted structure ====="
          find source | sort

          SETTINGS_FILE=$(find source -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find source -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Detected project:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "app/build.gradle not found."
            exit 1
          fi

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "gradlew not found."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew \
            assembleUserDebug \
            assembleAdminDebug \
            --stacktrace

          echo "===== APK Files ====="
          find app/build/outputs -type f -name "*.apk"

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: Pension-User-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/user/debug/*.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Pension-Admin-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
